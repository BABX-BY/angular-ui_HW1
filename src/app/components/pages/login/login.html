<div class="min-h-screen bg-gray-400 flex items-center justify-center p-4">
  <!-- กล่องฟอร์ม Login สีขาว -->
  <div class="bg-white p-8 rounded-md shadow-lg w-full max-w-[450px]">
    <!-- ส่วนหัว (ไอคอน + ข้อความหลัก) -->
    <div class="flex items-center justify-center mb-1">
      <!-- SVG ไอคอนแม่กุญแจแบบทึบ -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 mr-2 text-black"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
          clip-rule="evenodd"
        />
      </svg>
      <h2 class="text-2xl font-bold text-gray-900">Login to My System</h2>
    </div>

    <!-- ข้อความอธิบายย่อย -->
    <p class="text-gray-500 text-sm mb-6">Please enter username and password</p>

    <form>
      <!-- ช่องกรอก Email -->
      <div class="mb-4">
        <input
          type="email"
          placeholder="Email"
          class="w-full border border-gray-500 rounded px-4 py-3 text-gray-700 placeholder-gray-600 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600"
        />
      </div>

      <!-- ช่องกรอก Password -->
      <div class="mb-8">
        <input
          type="password"
          placeholder="Password"
          class="w-full border border-gray-500 rounded px-4 py-3 text-gray-700 placeholder-gray-600 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600"
        />
      </div>

      <!-- ส่วนปุ่ม Sign Up และ Login -->
      <div class="flex items-center justify-between">
        <a href="#" class="font-bold text-gray-900 text-sm hover:underline">Sign Up</a>
        <button
          type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded transition duration-200"
        >
          Login
        </button>
      </div>
    </form>
  </div>
</div>
